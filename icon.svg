<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- macOS Drop Shadows -->
    <filter id="squircleShadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
    </filter>

    <filter id="glyphShadow" x="180" y="240" width="664" height="544" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Base Canvas Squircle Gradient: Deep Sleek Slate & Obsidian Indigo -->
    <linearGradient id="bgGrad" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>

    <!-- Top Ambient Radial Glow (Cyan / Sky highlight) -->
    <radialGradient id="topGlow" cx="512" cy="120" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </radialGradient>

    <!-- Continuous Glass Rim Border -->
    <linearGradient id="rimGrad" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="15%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Document Plate Gradient -->
    <linearGradient id="docGrad" x1="512" y1="196" x2="512" y2="828" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Inner Plate Rim -->
    <linearGradient id="docRim" x1="512" y1="196" x2="512" y2="828" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Markdown Glyph Silver Gradient -->
    <linearGradient id="glyphGrad" x1="512" y1="300" x2="512" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Curator Arrow Cyan/Sapphire Gradient -->
    <linearGradient id="arrowGrad" x1="638" y1="376" x2="638" y2="648" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Frontmatter Accent Pill Gradient -->
    <linearGradient id="pillGrad" x1="448" y1="236" x2="576" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with macOS Shadow -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgGrad)" filter="url(#squircleShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#topGlow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Document Card Background Plate -->
  <rect x="172" y="196" width="680" height="632" rx="44" fill="url(#docGrad)" stroke="url(#docRim)" stroke-width="2"/>

  <!-- Top Metadata / Frontmatter Accent Bar -->
  <rect x="448" y="236" width="128" height="12" rx="6" fill="url(#pillGrad)"/>

  <!-- Markdown Frame (The classic rounded rect container) -->
  <rect x="248" y="294" width="528" height="424" rx="36" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="16"/>

  <!-- Inner Glyph Group with Shadow -->
  <g filter="url(#glyphShadow)">
    <!-- Markdown 'M' Glyph -->
    <path d="M 302 648 L 302 376 L 368 376 L 426 496 L 484 376 L 550 376 L 550 648 L 496 648 L 496 468 L 446 574 L 406 574 L 356 468 L 356 648 Z" fill="url(#glyphGrad)"/>

    <!-- Curator Downward Arrow Glyph -->
    <path d="M 610 376 L 666 376 L 666 520 L 722 520 L 638 648 L 554 520 L 610 520 Z" fill="url(#arrowGrad)"/>
    <path d="M 610 376 L 666 376 L 666 520 L 722 520 L 638 648 L 554 520 L 610 520 Z" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  </g>

  <!-- Curated Live Query Dots (indicating active daemon query status) -->
  <circle cx="472" cy="772" r="6.5" fill="#38BDF8" opacity="0.95"/>
  <circle cx="512" cy="772" r="6.5" fill="#60A5FA" opacity="0.75"/>
  <circle cx="552" cy="772" r="6.5" fill="#818CF8" opacity="0.55"/>

</svg>
